<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSL Console — sign in</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MSL CONSOLE — app.mslproducts.com
   Next.js: app/(auth)/* and app/(console)/* route groups
   Shares the marketing design tokens; denser scale.
   ============================================================ */
:root{
  --void:#05070B; --rack:#0A0E15; --steel:#111823; --raised:#161E2B;
  --wire:rgba(255,255,255,.09); --wire-2:rgba(255,255,255,.16);
  --ink:#EDF1F7; --ink-2:#9AA7BC; --ink-3:#63718A;
  --blue:#2E6BFF; --blue-hi:#5B8CFF; --blue-dim:rgba(46,107,255,.14);
  --signal:#4DE1FF; --thermal:#FFB020; --red:#FF5A5A;
  --disp:'Archivo',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --side:236px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-weight:300;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--blue);color:#fff}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 118;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(to right,rgba(255,255,255,.025) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 25%,transparent 80%)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  padding:12px 20px;border-radius:999px;transition:.16s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hi)}
.btn-ghost{border:1px solid var(--wire-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--blue-hi);color:var(--blue-hi);background:var(--blue-dim)}
.btn-danger{border:1px solid rgba(255,90,90,.35);color:var(--red)}
.btn-danger:hover{background:rgba(255,90,90,.1)}
.btn-sm{padding:8px 14px;font-size:10.5px}
.btn-full{width:100%}
.btn .ar{transition:transform .16s}
.btn:hover .ar{transform:translate(2px,-2px)}

/* ---------- fields ---------- */
.field{display:block;margin-bottom:16px}
.field span.lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;background:var(--rack);border:1px solid var(--wire);
  color:var(--ink);padding:11px 13px;font-family:var(--body);font-size:.9375rem;border-radius:3px;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-dim)}
.field .hint{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:6px;letter-spacing:.05em}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.f2{grid-template-columns:1fr}}

/* ============================================================
   AUTH SCREENS — split: form left, telemetry panel right
   ============================================================ */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);position:relative;z-index:1}
.auth-l{display:flex;align-items:center;justify-content:center;padding:48px 40px;border-right:1px solid var(--wire)}
.auth-box{width:100%;max-width:380px}
.auth-r{position:relative;overflow:hidden;
  background:radial-gradient(ellipse 100% 80% at 70% 20%,rgba(46,107,255,.16),transparent 60%),var(--void);
  display:flex;flex-direction:column;justify-content:center;padding:48px 44px;gap:22px}
@media(max-width:940px){
  .auth{grid-template-columns:1fr}
  .auth-l{border-right:none;padding:36px 24px;min-height:100vh}
  .auth-r{display:none}
}
.brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:34px}
.brand svg{width:24px;height:24px;flex:none}
.brand span{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 122;
  text-transform:uppercase;font-size:14px;letter-spacing:.06em}
.brand s{text-decoration:none;color:var(--ink-3);font-weight:500}
.auth h1{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 116;
  text-transform:uppercase;font-size:2rem;line-height:.95;letter-spacing:-.018em;margin-bottom:10px}
.auth .sub{color:var(--ink-2);font-size:.9375rem;margin-bottom:28px}
.sso{display:grid;gap:9px;margin-bottom:22px}
.sso button{display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--wire);
  background:var(--rack);padding:11px;border-radius:3px;font-size:.875rem;color:var(--ink-2);transition:.15s}
.sso button:hover{border-color:var(--wire-2);color:var(--ink);background:var(--steel)}
.divider{display:flex;align-items:center;gap:14px;margin:22px 0;
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--wire)}
.auth-foot{margin-top:24px;padding-top:20px;border-top:1px solid var(--wire);
  font-size:.875rem;color:var(--ink-3)}
.auth-foot a{color:var(--blue-hi)}
.alert{border:1px solid var(--wire);border-left:2px solid var(--thermal);background:var(--rack);
  padding:11px 14px;font-size:.8125rem;color:var(--ink-2);margin-bottom:18px;border-radius:3px}
.alert.err{border-left-color:var(--red)}
.alert.ok{border-left-color:var(--signal)}
.otp{display:flex;gap:9px;margin-bottom:18px}
.otp input{width:100%;text-align:center;font-family:var(--mono);font-size:1.25rem;padding:13px 0;
  background:var(--rack);border:1px solid var(--wire);color:var(--ink);border-radius:3px}
.otp input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}

/* auth right panel */
.panel-card{border:1px solid var(--wire);background:rgba(10,14,21,.7);border-radius:4px;overflow:hidden;backdrop-filter:blur(6px)}
.panel-card .h{padding:11px 15px;border-bottom:1px solid var(--wire);background:rgba(255,255,255,.02);
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  display:flex;justify-content:space-between;align-items:center}
.panel-card .b{padding:15px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--signal);display:inline-block;
  box-shadow:0 0 0 0 rgba(77,225,255,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(77,225,255,0)}100%{box-shadow:0 0 0 0 rgba(77,225,255,0)}}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--wire);border:1px solid var(--wire)}
.mini div{background:var(--rack);padding:14px}
.mini .v{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 110;font-size:1.35rem;line-height:1}
.mini .v s{text-decoration:none;color:var(--blue-hi)}
.mini .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}
.quote{font-size:1.05rem;color:var(--ink);line-height:1.5;max-width:34ch}
.quote+.by{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}

/* ============================================================
   CONSOLE SHELL
   ============================================================ */
.app{display:none;min-height:100vh;position:relative;z-index:1}
.app.on{display:grid;grid-template-columns:var(--side) 1fr}
.side{border-right:1px solid var(--wire);background:var(--rack);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.side-top{padding:16px 18px;border-bottom:1px solid var(--wire)}
.proj{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid var(--wire);background:var(--steel);padding:9px 11px;border-radius:3px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink);margin-top:14px;transition:.15s}
.proj:hover{border-color:var(--wire-2)}
.proj i{font-style:normal;color:var(--ink-3);font-size:9px}
.side nav{padding:12px 10px;flex:1}
.side nav h6{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);padding:14px 10px 7px}
.side nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;
  font-size:.875rem;color:var(--ink-2);transition:.14s;margin-bottom:1px}
.side nav a:hover{background:rgba(255,255,255,.045);color:var(--ink)}
.side nav a.on{background:var(--blue-dim);color:var(--blue-hi)}
.side nav a svg{width:15px;height:15px;flex:none;opacity:.8}
.side nav a .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.side-foot{padding:14px 16px;border-top:1px solid var(--wire)}
.usr{display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#fff}
.usr .n{font-size:.8125rem;color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr .e{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(5,7,11,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--wire);padding:0 26px;height:56px;display:flex;align-items:center;
  justify-content:space-between;gap:16px}
.topbar .where{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.topbar .where b{color:var(--ink);font-weight:400}
.topbar .tools{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--wire);background:var(--rack);
  padding:6px 12px;border-radius:999px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);transition:.15s}
.pill:hover{border-color:var(--wire-2);color:var(--ink)}
.pill.live{color:var(--signal)}
.body{padding:30px 26px 70px;flex:1}
.burger{display:none;width:36px;height:36px;align-items:center;justify-content:center}
.burger span{display:block;width:17px;height:1px;background:var(--ink);position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:17px;height:1px;background:var(--ink)}
.burger span::before{top:-5px}.burger span::after{top:5px}
@media(max-width:900px){
  .app.on{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:50;transform:translateX(-100%);
    transition:transform .22s ease;height:100vh}
  .side.open{transform:none}
  .burger{display:flex}
  .body{padding:22px 16px 60px}
  .topbar{padding:0 14px}
  .topbar .where{display:none}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.scrim.on{display:block}

/* ---------- page head ---------- */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.phead h1{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 116;
  text-transform:uppercase;font-size:1.7rem;line-height:.98;letter-spacing:-.015em}
.phead p{color:var(--ink-2);font-size:.875rem;margin-top:7px;max-width:62ch}
.view{display:none}
.view.on{display:block;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--wire);
  border:1px solid var(--wire);margin-bottom:26px}
.tile{background:var(--rack);padding:18px}
.tile .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 110;
  font-size:1.65rem;line-height:1;margin-top:11px;letter-spacing:-.02em}
.tile .v s{text-decoration:none;color:var(--blue-hi);font-size:1.1rem}
.tile .d{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:8px;letter-spacing:.05em}
.tile .d.up{color:var(--signal)} .tile .d.warn{color:var(--thermal)}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.tiles{grid-template-columns:1fr}}

/* ---------- panels ---------- */
.panel{border:1px solid var(--wire);background:var(--rack);margin-bottom:22px}
.panel>.h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--wire);background:rgba(255,255,255,.02)}
.panel>.h h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500}
.panel>.b{padding:16px}
.panel>.b.flush{padding:0}
.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:11px 16px;border-bottom:1px solid var(--wire);font-weight:500;white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.875rem;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(46,107,255,.05)}
td.n{color:var(--ink)}
td.m{font-family:var(--mono);font-size:.8125rem;color:var(--ink-3)}
td.r{font-family:var(--mono);font-size:.8125rem;color:var(--signal);white-space:nowrap}
td.act{text-align:right;white-space:nowrap}

/* ---------- badges ---------- */
.b-{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--wire-2);color:var(--ink-3)}
.b- i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-run{color:var(--signal);border-color:rgba(77,225,255,.32);background:rgba(77,225,255,.07)}
.b-prov{color:var(--thermal);border-color:rgba(255,176,32,.32);background:rgba(255,176,32,.07)}
.b-stop{color:var(--ink-3)}
.b-err{color:var(--red);border-color:rgba(255,90,90,.32);background:rgba(255,90,90,.07)}
.b-paid{color:var(--signal);border-color:rgba(77,225,255,.32)}
.b-due{color:var(--thermal);border-color:rgba(255,176,32,.32)}

/* ---------- charts ---------- */
.spark{width:100%;height:120px}
.meter{height:7px;background:var(--steel);border-radius:99px;overflow:hidden;border:1px solid var(--wire)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--signal));border-radius:99px;
  transition:width .8s ease}
.meter i.warn{background:linear-gradient(90deg,var(--thermal),#FF7A45)}
.legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;color:var(--ink-3);margin-top:9px}
.legend b{color:var(--ink);font-weight:400}

/* ---------- lists ---------- */
.rows>div{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
.rows>div:last-child{border-bottom:none}
.rows .t{font-size:.875rem;color:var(--ink)}
.rows .s{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;
  text-transform:uppercase;margin-top:4px}
.rows .r{font-family:var(--mono);font-size:.8125rem;color:var(--signal);white-space:nowrap}

/* ---------- modal ---------- */
.modal{display:none;position:fixed;inset:0;z-index:70;align-items:center;justify-content:center;padding:20px;
  background:rgba(2,4,8,.72);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.modal-in{background:var(--rack);border:1px solid var(--wire-2);border-radius:4px;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
  border-bottom:1px solid var(--wire)}
.modal-h h3{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 114;
  text-transform:uppercase;font-size:1.05rem;letter-spacing:-.01em}
.modal-b{padding:20px}
.modal-f{padding:16px 20px;border-top:1px solid var(--wire);display:flex;justify-content:flex-end;gap:10px}
.x{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);
  border-radius:4px;transition:.15s}
.x:hover{background:rgba(255,255,255,.06);color:var(--ink)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:52px 20px}
.empty p{color:var(--ink-3);font-size:.875rem;margin:10px 0 18px}
.empty h4{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 112;
  text-transform:uppercase;font-size:1.05rem}
.kv{display:grid;grid-template-columns:150px 1fr}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  padding:11px 0;border-bottom:1px solid var(--wire)}
.kv dd{padding:11px 0;border-bottom:1px solid var(--wire);color:var(--ink-2);font-size:.875rem}
@media(max-width:560px){.kv{grid-template-columns:1fr}.kv dt{border-bottom:none;padding-bottom:2px}}
.code{background:#080B11;border:1px solid var(--wire);border-radius:3px;padding:13px;
  font-family:var(--mono);font-size:11.5px;line-height:1.8;overflow-x:auto;color:var(--ink-2)}
.code .s{color:var(--signal)} .code .k{color:var(--blue-hi)} .code .c{color:var(--ink-3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--steel);border:1px solid var(--wire-2);border-left:2px solid var(--signal);
  padding:12px 18px;border-radius:4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  z-index:90;transition:transform .3s ease;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.on{transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--wire);margin-bottom:20px;overflow-x:auto}
.tabs button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:11px 15px;color:var(--ink-3);border-bottom:1px solid transparent;margin-bottom:-1px;
  transition:.15s;white-space:nowrap}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--blue-hi);border-bottom-color:var(--blue)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"><div class="modal-in" id="modalIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   MSL CONSOLE
   Next.js mapping:
     /login /signup /forgot /verify  -> app/(auth)/<seg>/page.tsx
     /console/*                      -> app/(console)/<seg>/page.tsx
   State here is client-side mock data. In production every
   render() below becomes a server component reading from /v1.
   ============================================================ */

/* ---------- views ---------- */
function sparkline(data, w, h){
  var max = Math.max.apply(null, data), min = 0;
  var pts = data.map(function(v,i){
    var x = (i/(data.length-1))*w;
    var y = h - ((v-min)/(max-min))*(h-8) - 4;
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  var area = 'M0,' + h + ' L' + pts.join(' L') + ' L' + w + ',' + h + ' Z';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6BFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2E6BFF" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#4DE1FF" stroke-width="1.4"/>
  </svg>`;
}

/* ============================================================
   ROUTER + WIRING
   ============================================================ */
var authed = false;

function render(){
  var path = (location.hash || '#/login').replace('#','');
  var isConsole = path.indexOf('/console') === 0;

  if(isConsole && !authed){ location.hash = '#/login'; return; }

  if(!isConsole){
    var v = V[path] || V['/login'];
    document.title = 'MSL Console \u2014 ' + path.replace('/','');
    root.innerHTML = v();
    wireAuth();
  } else {
    var seg = path.replace('/console','').replace('/','');
    var view = C[seg] ? seg : '';
    document.title = 'MSL Console \u2014 ' + (ROUTES.filter(function(r){return r.seg===view;})[0]||ROUTES[0]).title;
    root.innerHTML = shell(view);
    $('viewBody').innerHTML = C[view]();
    wireConsole(view);
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);

/* ---------- auth wiring ---------- */
function alertBox(kind, msg){
  var el = $('authErr');
  if(el) el.innerHTML = '<div class="alert ' + kind + '">' + msg + '</div>';
}

function signIn(){
  authed = true;
  location.hash = '#/console';
}

function wireAuth(){
  document.querySelectorAll('[data-sso]').forEach(function(b){
    b.addEventListener('click', function(){
      alertBox('ok', 'Redirecting to ' + b.dataset.sso + '\u2026');
      setTimeout(signIn, 700);
    });
  });

  var lf = $('loginForm');
  if(lf) lf.addEventListener('submit', function(e){
    e.preventDefault();
    var em = lf.elements.email.value.trim(), pw = lf.elements.password.value;
    if(!em.includes('@')){ alertBox('err','Enter a valid work email address.'); return; }
    if(pw.length < 6){ alertBox('err','That password is too short. Passwords are at least 12 characters.'); return; }
    alertBox('ok','Checking credentials\u2026');
    setTimeout(function(){ location.hash = '#/verify'; }, 600);
  });

  var sf = $('signupForm');
  if(sf) sf.addEventListener('submit', function(e){
    e.preventDefault();
    var em = sf.elements.email.value.trim(), pw = sf.elements.password.value;
    if(!em.includes('@')){ alertBox('err','Enter a valid work email address.'); return; }
    if(pw.length < 12){ alertBox('err','Passwords need at least 12 characters. Length beats complexity.'); return; }
    S.user.name = sf.elements.first.value + ' ' + sf.elements.last.value;
    S.user.email = em;
    S.user.initials = (sf.elements.first.value[0]||'A') + (sf.elements.last.value[0]||'B');
    S.org.name = sf.elements.company.value || S.org.name;
    S.region = sf.elements.region.value.split(' ')[0];
    alertBox('ok','Account created. Evaluation credits applied.');
    setTimeout(signIn, 800);
  });

  var ff = $('forgotForm');
  if(ff) ff.addEventListener('submit', function(e){
    e.preventDefault();
    var em = ff.elements.email.value.trim();
    if(!em.includes('@')){ alertBox('err','Enter a valid work email address.'); return; }
    alertBox('ok','If an account exists for ' + em + ', a reset link is on its way.');
  });

  var of = $('otpForm');
  if(of){
    var boxes = of.querySelectorAll('.otp input');
    boxes.forEach(function(b,i){
      b.addEventListener('input', function(){
        b.value = b.value.replace(/\D/g,'');
        if(b.value && boxes[i+1]) boxes[i+1].focus();
      });
      b.addEventListener('keydown', function(e){
        if(e.key === 'Backspace' && !b.value && boxes[i-1]) boxes[i-1].focus();
      });
    });
    if(boxes[0]) boxes[0].focus();
    of.addEventListener('submit', function(e){
      e.preventDefault();
      var code = Array.prototype.map.call(boxes, function(b){ return b.value; }).join('');
      if(code.length < 6){ alertBox('err','Enter all six digits.'); return; }
      alertBox('ok','Verified. Opening your console\u2026');
      setTimeout(signIn, 600);
    });
  }
}

/* ---------- console wiring ---------- */

    side.classList.toggle('open'); scrim.classList.toggle('on');
  });
  scrim.addEventListener('click', closeSide);
  side.querySelectorAll('nav a').forEach(function(a){ a.addEventListener('click', closeSide); });

  $('signout').addEventListener('click', function(){

        <label class="field"><span class="lbl">Expires</span><select>

      openModal(`<div class="modal-h"><h3>Key created</h3><button class="x" data-close>\u2715</button></div>

          <div class="alert ok">Copy this now. It will not be shown again.</div>

      $('viewBody').innerHTML = C[view](); wireConsole(view);
    });
  });

  document.querySelectorAll('[data-revoke]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = S.keys.filter(function(x){ return x.id === b.dataset.revoke; })[0];
      openModal(`<div class="modal-h"><h3>Revoke key</h3><button class="x" data-close>\u2715</button></div>

  /* team */
  var iv = $('invite');
  if(iv) iv.addEventListener('click', function(){

    $('iSend').addEventListener('click', function(){
      var em = $('iEmail').value.trim();

      S.team.push({ name:em.split('@')[0].replace(/\./g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}),
                    email:em, role:$('iRole').value, mfa:false, last:'Invited' });
      closeModal(); toast('Invite sent to ' + em);
      $('viewBody').innerHTML = C[view](); wireConsole(view);

  var ef = $('enforceMfa');
